name: AML Mod Compiler

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Download AndroidModLoader template
      run: |
        curl -L -o ./AML_src.zip https://github.com
        unzip ./AML_src.zip
        mv ./AndroidModLoader-main/mod ./mod

    - name: Install Android NDK (r25c)
      uses: nttld/setup-ndk@v1.5.0
      with:
        ndk-version: r25c

    - name: Build the code
      run: |
        ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j4

    - name: Upload the mod!
      uses: actions/upload-artifact@v4
      with:
        name: RealTrafficFix-Android
        path: libs/
